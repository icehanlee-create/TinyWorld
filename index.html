<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4ede0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<title>奇幻小鎮大搜查</title>
<style>
:root{--bg:#f3e7cb;--ink:#2b2420;--muted:#7a6e60;--accent:#c4572f;--ok:#4f8a3a;--card:#fffaf0;--line:#dccfae;--bar:#3a4250}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2f3a4a;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#f4ede0;cursor:grab}
#world,#fogWorld{position:absolute;left:0;top:0;width:2800px;height:1800px;transform-origin:0 0;will-change:transform}
#fogWorld{pointer-events:none}
.drift{transform-box:fill-box;animation:drift var(--d,24s) ease-in-out infinite}@keyframes drift{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
.jig{transform-box:fill-box;transform-origin:50% 100%;animation:jig .5s ease-out}@keyframes jig{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7px) rotate(-6deg)}40%{transform:translateY(0) rotate(5deg) scale(1.05,.95)}60%{transform:translateY(-3px) rotate(-3deg)}80%{transform:rotate(2deg)}}
#world svg,#fogWorld svg{position:absolute;left:-300px;top:-300px;width:3400px;height:2400px;overflow:hidden}
.fc{transition:opacity .9s,transform .9s;transform-box:fill-box;transform-origin:center}.fc.gone{opacity:0;transform:scale(1.35)}
#lockWall{transition:opacity 2.2s}#lockWall.gone2{opacity:0}
#ride{position:absolute;inset:0;z-index:6;opacity:0;pointer-events:none;transition:opacity .5s;background:#f6efe0}#ride.on{opacity:1;pointer-events:auto}#ride svg{position:absolute;inset:0;width:100%;height:100%}#ride span{position:absolute;left:50%;top:12%;transform:translateX(-50%);white-space:nowrap;font-size:16px;font-weight:700;color:#2b2420;background:rgba(255,250,240,.9);padding:8px 16px;border-radius:999px;border:2px solid #2b2420}
.rl{animation:rl var(--d) linear infinite}@keyframes rl{to{transform:translateX(-399px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gallop{transform-box:fill-box;transform-origin:50% 0;animation:gal .42s ease-in-out infinite alternate}@keyframes gal{from{transform:rotate(-18deg)}to{transform:rotate(16deg)}}
.cbob{animation:cbob .21s ease-in-out infinite alternate}@keyframes cbob{to{transform:translateY(-3px)}}
.dust{transform-box:fill-box;transform-origin:center;animation:dust .75s ease-out infinite}@keyframes dust{from{transform:translate(0,0) scale(.6);opacity:.9}to{transform:translate(-40px,-14px) scale(1.4);opacity:0}}
#curtain{position:absolute;inset:0;background:#f4ede0;opacity:0;pointer-events:none;transition:opacity .45s;display:grid;place-items:center;z-index:5}#curtain.on{opacity:1;pointer-events:auto}#curtain svg{position:absolute;inset:0;width:100%;height:100%}#curtain span{position:relative;font-size:15px;color:#7a6e60;font-weight:700;background:rgba(244,237,224,.85);padding:6px 14px;border-radius:999px}
.cdrift{animation:cdr 3s ease-in-out infinite}@keyframes cdr{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.chip.bump .ic{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
.item .inner{transform-box:fill-box;transform-origin:center}
.item.got .inner{animation:vanish .55s ease-in forwards}
@keyframes vanish{0%{transform:scale(1);opacity:1}35%{transform:scale(1.5);opacity:1}100%{transform:scale(0);opacity:0}}

:root{--ink:#2b2420;--paper:#fffaf0;--parch:#fbf3e2;--acc:#a8461f;--muted:#5f554a;--gold:#f5c842;--ok:#3d7a32;--ui:'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}
#app{position:relative;height:100vh;height:100dvh;max-width:600px;margin:0 auto;background:#f4ede0;overflow:hidden;font-family:var(--ui)}
#stage{position:absolute;inset:0}
button{font-family:var(--ui);cursor:pointer}
#hud{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);height:64px;z-index:7;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.ring{position:relative;width:46px;height:46px;flex:none}.ring svg{width:46px;height:46px;display:block}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400}
.fstat{display:flex;flex-direction:column;line-height:1.15}.fstat span{font-size:12px;color:var(--muted)}.fstat b{font-size:17px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{display:flex;align-items:center;gap:4px;margin-left:2px;font-size:17px;font-variant-numeric:tabular-nums}.timer b{font-weight:400}
.hb{width:44px;height:44px;flex:none;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);padding:0;position:relative}
.hb:active{transform:scale(.94)}.hb.hint{background:var(--gold)}.hb:disabled{opacity:.45}
.badge{position:absolute;right:-8px;top:-8px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12px;display:grid;place-items:center}
#menu{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 86px);z-index:8;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column;min-width:190px}
#menu.hide{display:none}
#menu button{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border:none;background:none;font-size:16px;color:var(--ink);border-radius:10px;text-align:left}
#menu button:active{background:#f1e6cf}#menu .sep{height:2px;background:var(--ink);opacity:.1;margin:2px 6px}#menu .warn{color:var(--acc)}
.zpill{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.zpill button{width:44px;height:44px;border:none;background:none;display:grid;place-items:center;color:var(--ink);padding:0}.zpill button:active{background:#f1e6cf}
.zpill i{display:block;height:2px;background:var(--ink);opacity:.15}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 90px);transform:translate(-50%,-8px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:7}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tray{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--parch);border-top:2.5px solid var(--ink);border-radius:22px 22px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.handle{width:44px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;align-self:center}
.thead{display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15px}
.thead em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
#trayToggle{height:34px;padding:0 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);display:flex;align-items:center;gap:2px;font-size:13px;color:var(--ink)}
#chips{display:flex;gap:8px;padding:4px 14px 4px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#chips::-webkit-scrollbar{display:none}
#tray.collapsed #chips{display:none}
.chip{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;padding:0}
.chip .ic{position:relative;width:54px;height:54px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center}
.chip .ic svg{width:38px;height:38px}
.chip .dots{display:flex;gap:3px}.chip .dots i{width:8px;height:8px;border-radius:50%;border:1.6px solid var(--ink);background:var(--paper);display:block}.chip .dots i.on{background:var(--acc)}
.chip.done .ic{background:#e4efd6}.chip.done .ic>svg{opacity:.65}
.chip .ok{position:absolute;right:-5px;top:-5px;width:21px;height:21px;border-radius:50%;background:var(--ok);color:#fff;border:2px solid var(--ink);display:none;place-items:center;font-size:11px}
.chip.done .ok{display:grid}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(43,36,32,.55);font-family:var(--ui);color:var(--ink)}
.overlay.hide{display:none}
#mapOv{z-index:12;isolation:isolate}#mapOv .mapc{-webkit-transform:translateZ(0);transform:translateZ(0)}
/* 有任何面板打開時，背景場景暫停動畫，減少手機重繪與閃爍 */
body:has(.overlay:not(.hide)) #world .an,body:has(.overlay:not(.hide)) .drift{animation-play-state:paused!important}
.pcard{position:relative;width:100%;max-width:400px;background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.pbtn{width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);font-size:19px}
.sbtn{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;font-size:15px;padding:0 12px}
.pbtn:active,.sbtn:active{transform:translateY(2px)}
.overlay.start{align-items:flex-end;padding:0;background:linear-gradient(rgba(43,36,32,0) 0%,rgba(43,36,32,.15) 40%,rgba(43,36,32,.35) 100%)}
.shero{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 16px);display:flex;justify-content:space-between;align-items:flex-start;max-width:568px;margin:0 auto}
.lvchip{display:inline-block;font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
#gameTitle{margin:8px 0 0;font-size:34px;font-weight:400;color:var(--paper);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
.sheet{position:relative;width:100%;max-width:600px;background:var(--parch);border-top:2.5px solid var(--ink);border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:78vh;max-height:78dvh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:baseline;justify-content:space-between}.shead b{font-size:18px;font-weight:400}.shead span{font-size:13px;color:var(--muted)}
#startDesc{margin:0;font-size:13px;color:var(--acc)}#startDesc:empty{display:none}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.sgrid div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.sgrid .t{width:58px;height:58px;border-radius:16px;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center}.sgrid svg{width:40px;height:40px}
.how{display:flex;gap:6px;background:var(--paper);border:2px solid #e2d4b6;border-radius:14px;padding:10px 6px}.how div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center;line-height:1.35}.how svg{color:var(--ink)}
.rule{margin:0;font-size:13px;color:var(--muted);text-align:center}
#startBest{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}#startBest:empty{display:none}
.testrow{display:flex;flex-direction:column;align-items:center;gap:6px}#testBadge{margin:0;color:var(--ok);font-size:13px}
.mapc{background:var(--parch);padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overflow-x:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.mhead b{font-size:26px;font-weight:400;display:block}.mhead span{font-size:13px;color:var(--muted)}
#mapSvg svg{display:block;width:100%;height:auto}
#mapCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding-top:6px}
.lcard{position:relative;min-width:0;text-align:left;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:9px 8px;display:flex;flex-direction:column;gap:3px;color:var(--ink);min-height:44px}
.lcard.here{background:#fdf0c4}.lcard .here-tag{position:absolute;top:-11px;right:6px;background:var(--gold,#f5c842);border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;white-space:nowrap}
.lcard .nm{font-size:14px;letter-spacing:-.3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lcard .stars{display:flex;gap:1px}
.lcard .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}.lcard .top>span:first-child,.lcard .top>b:first-child{white-space:nowrap}body:has(#startOv:not(.hide)) #hud,body:has(#startOv:not(.hide)) .zpill,body:has(#startOv:not(.hide)) #tray{visibility:hidden}body:has(#mapOv:not(.hide)) #hud,body:has(#mapOv:not(.hide)) .zpill,body:has(#mapOv:not(.hide)) #tray{visibility:hidden}.lcard small{font-size:12px;color:var(--muted)}
.tag{font-size:12px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
.stars{display:flex;gap:2px}
.mnode{cursor:pointer}
.winc{padding:42px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
.ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 22px;font-size:22px;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.wstars{display:flex;gap:10px;align-items:flex-start}.wstars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;margin-top:10px;animation:starpop .45s both}.wstars div.mid{margin-top:0}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wstats{display:flex;gap:8px;width:100%}.wstats div{flex:1;background:var(--parch);border:2px solid #e2d4b6;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center}.wstats b{font-size:20px;font-weight:400}.wstats span{font-size:12px;color:var(--muted)}
#winTag{font-size:13px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:2px 12px}
.wnext{width:100%;display:flex;gap:12px;align-items:center;background:var(--parch);border:2px dashed #c9b893;border-radius:14px;padding:10px;text-align:left}.wnext .pv{border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;width:120px;height:84px;flex:none}.wnext .pv svg{display:block}.wnext small{font-size:12px;color:var(--muted);display:block}.wnext b{display:block;font-size:18px;font-weight:400}
.row2{display:flex;gap:10px;width:100%}
/* idle animations: paused unless near the view */
.an{transform-box:fill-box;transform-origin:50% 100%;animation-duration:var(--d,2s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-play-state:paused}
.on .an{animation-play-state:running}
.still .an{animation:none!important}
.a-bob{animation-name:bob}.a-sway{animation-name:sway}.a-hop{animation-name:hop}.a-wig{animation-name:wig}.a-peck{animation-name:peck}
.a-float{animation-name:float}.a-rock{animation-name:rock}.a-swim{animation-name:swim}.a-flap{animation-name:flap}
.a-swing{transform-origin:50% 0%;animation-name:swing}@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-spin{transform-origin:50% 50%;animation-name:spin;animation-timing-function:linear}
.a-steam{animation-name:steam;animation-timing-function:ease-out}@keyframes steam{0%{transform:translateY(8px) scale(.75);opacity:0}30%{opacity:.85}100%{transform:translateY(-26px) scale(1.25);opacity:0}}
.a-flag{transform-origin:0% 50%;animation-name:flag}.a-fire{animation-name:fire}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,62%,100%{transform:translateY(0) scale(1,1)}70%{transform:translateY(0) scale(1.06,.92)}80%{transform:translateY(-7px) scale(.96,1.05)}90%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wig{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-9deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-4deg)}}
@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(22deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rock{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-2px) rotate(3deg)}}
@keyframes swim{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes flap{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flag{0%,100%{transform:skewY(-8deg) scaleX(1)}50%{transform:skewY(8deg) scaleX(.85)}}
@keyframes fire{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.18)}}
@media (prefers-reduced-motion:reduce){.an{animation:none!important}}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted)}
#stage{overflow:hidden;touch-action:none;background:#f4ede0;cursor:grab}
</style>
</head>
<body>
<div id="app">
<div id="stage">
    <div id="loading">小鎮建造中…</div>
    <div id="world">
      <svg id="bgSvg" viewBox="-300 -300 3400 2400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="cob" width="34" height="22" patternUnits="userSpaceOnUse"><rect width="34" height="22" fill="#e6d3a6"/><path d="M1,1 h15 v9 h-15z M18,1 h15 v9 h-15z M-8,12 h15 v9 h-15z M9,12 h15 v9 h-15z M26,12 h15 v9 h-15z" fill="#ead9b0" stroke="#c9b083" stroke-width="1.2"/></pattern>
          <pattern id="stp" width="10" height="12" patternUnits="userSpaceOnUse"><rect width="10" height="12" fill="#d9bf8c"/><path d="M0,11 H10" stroke="#8a6a4a" stroke-width="2"/></pattern>
          <pattern id="stone" width="26" height="13" patternUnits="userSpaceOnUse"><rect width="26" height="13" fill="#b9ab8c"/><path d="M1,1 h11 v5 h-11z M14,1 h11 v5 h-11z M-6,7 h11 v5 h-11z M7,7 h11 v5 h-11z M20,7 h11 v5 h-11z" fill="#c6b99a" stroke="#6e5f48" stroke-width="1"/></pattern>
          <pattern id="wheat" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d9c06a"/><path d="M2,9 V3 M7,10 V4" stroke="#a88a3a" stroke-width="1.4"/></pattern>
          <pattern id="cabbage" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#a9b770"/><circle cx="5" cy="5" r="4" fill="#86a85a" stroke="#5f7a3a" stroke-width="1"/><circle cx="14" cy="13" r="4" fill="#86a85a" stroke="#5f7a3a" stroke-width="1"/></pattern>
          <pattern id="soil" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#a8825c"/><path d="M0,10 H16" stroke="#7a5a3a" stroke-width="1.4"/><path d="M4,8 l-2,-4 M4,8 l2,-4 M12,8 l-2,-4 M12,8 l2,-4" stroke="#6f8f4a" stroke-width="1.3"/></pattern>
          <pattern id="plank" width="40" height="12" patternUnits="userSpaceOnUse"><rect width="40" height="12" fill="#c99a5b"/><path d="M0,11.5 H40 M20,0 V12" stroke="#7a5235" stroke-width="1.6"/></pattern>
          <pattern id="aw1" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c4572f"/><rect x="10" width="10" height="10" fill="#fbf6ea"/></pattern>
          <pattern id="aw2" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#6fa8a0"/><rect x="10" width="10" height="10" fill="#fbf6ea"/></pattern>
          <pattern id="aw3" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e0b44a"/><rect x="10" width="10" height="10" fill="#fbf6ea"/></pattern>
          <pattern id="aw4" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#9a6fa8"/><rect x="10" width="10" height="10" fill="#fbf6ea"/></pattern>
        </defs>

function goLevel(n){$('#mapOv').classList.add('hide');const under=mapUnder;mapUnder=[];if(n===level&&scene===n&&!st.running&&under.includes('startOv')){$('#startOv').classList.remove('hide');return}if(n===level&&scene===n&&st.running)return;st.running=false;clearInterval(timer);$('#winOv').classList.add('hide');
 if(scene!==n){curtain(()=>{loadScene(n);setLevel(n);measure();const c=LEVELS[n].c;view={s:base,tx:SW/2-c[0]*base,ty:SH/2-c[1]*base};clampV();apply();$('#startOv').classList.remove('hide')},'前往'+MAPNODES.find(m=>m.n===n).name+'⋯')}
 else{setLevel(n);$('#startOv').classList.remove('hide')}}

/* ---- hay cart ride ---- */

 let g=`<g class="cbob">`;

 g+=limb('M8,-30 L48,-38','#7a5235',2.6);
 g+=legs+`<path d="M44,-44 Q30,-40 34,-26 Q38,-34 46,-36" fill="#3a2a22"/><ellipse cx="70" cy="-44" rx="27" ry="13" fill="#a0623a"/>`;
 g+=`<path d="M86,-50 Q94,-74 104,-82 L116,-74 Q104,-62 98,-40Z" fill="#a0623a"/><ellipse cx="114" cy="-76" rx="13" ry="8.5" fill="#a0623a" transform="rotate(28 114 -76)"/><path d="M104,-86 l-2,-9 l7,6Z" fill="#a0623a"/>`;
 g+=`<path d="M100,-86 Q90,-74 86,-52 Q92,-66 98,-72 Q94,-62 92,-50" fill="#3a2a22"/><circle cx="112" cy="-80" r="1.6" fill="${OL}" stroke="none"/><ellipse cx="121" cy="-71" rx="1.4" ry="1" fill="${OL}" stroke="none"/>`;
 g+=`<path d="M60,-56 Q72,-60 84,-55 M92,-58 L104,-74" fill="none" stroke="#c4473c" stroke-width="2.2"/>`;
 g+=`<path d="M-70,-42 Q-62,-74 -32,-70 Q-6,-76 8,-42Z" fill="#e8c46a"/><path d="M-56,-50 l4,-12 M-40,-48 l2,-16 M-22,-50 l3,-14 M-6,-48 l-2,-10" fill="none" stroke-width="1.2"/>`;
 g+=`<g transform="translate(-34,-60) scale(.62)">${chibi({arm:1,sit:true,hat:1,mood:1})}</g>`;
 g+=`<path d="M-72,-42 L12,-42 L8,-22 L-68,-22Z" fill="#a8703f"/><path d="M-70,-34 H10" fill="none" stroke-width="1.2"/>`;
 g+=`<g transform="translate(-2,-42) scale(.62)">${kid({pose:'reach',hat:pk([1,4])})}</g><path d="M6,-55 Q60,-70 104,-74" fill="none" stroke="#7a5235" stroke-width="1.2"/>`;
 [[-52,-16],[-12,-16]].forEach(([x,y])=>g+=`<g transform="translate(${x},${y})"><g class="wheel"><circle r="16" fill="#c99a5b"/><circle r="4" fill="#7a5235"/><path d="M0,-15 V15 M-15,0 H15 M-10.6,-10.6 L10.6,10.6 M10.6,-10.6 L-10.6,10.6" fill="none" stroke-width="1.6"/></g></g>`);
 return g+`</g>`+[0,1,2].map(i=>`<circle class="dust" cx="-78" cy="-8" r="${5+i*2}" fill="#e2d2a8" stroke-width="1.3" style="animation-delay:-${i*.25}s"/>`).join('');
}
function rideSVG(){
 const loop=(inner,dur)=>`<g class="rl" style="--d:${dur}s"><g>${inner}</g><g transform="translate(399,0)">${inner}</g></g>`;
 let s=`<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><g stroke="${OL}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">`;
 s+=`<rect width="400" height="600" fill="#f6efe0" stroke="none"/><circle cx="320" cy="120" r="34" fill="#f5d27a" stroke="none"/>`;
 s+=loop(T(70,150,.9,swirl())+T(270,90,.7,swirl()),40);
 s+=loop(`<path d="M0,300 L0,250 Q50,190 100,240 Q150,170 210,235 Q270,180 320,240 Q360,200 400,250 L400,300Z" fill="#cdd3b4" stroke="none"/><path d="M0,250 Q50,190 100,240 Q150,170 210,235 Q270,180 320,240 Q360,200 400,250" fill="none" stroke="#8f9a7c" stroke-width="1.6"/>`,26);
 s+=loop(`<path d="M0,360 L0,300 Q70,262 140,296 Q210,258 280,294 Q340,266 400,300 L400,360Z" fill="#8f9d58" stroke="none"/><path d="M0,300 Q70,262 140,296 Q210,258 280,294 Q340,266 400,300" fill="none"/>`+[40,130,250,330].map(x=>`<g transform="translate(${x},${300-((x*7)%14)}) scale(.45)">${roundTree()}</g>`).join('')+`<g transform="translate(190,292) scale(.35)">${barn()}</g>`,12);
 s+=loop(`<rect x="0" y="352" width="400" height="80" fill="url(#wheat)" stroke="none"/><path d="M0,352 H400" fill="none" stroke-width="1.6"/>`+[...Array(9)].map((_,i)=>`<rect x="${i*45+6}" y="404" width="6" height="28" rx="2" fill="#f1ead8"/>`).join('')+`<path d="M0,412 H400 M0,422 H400" fill="none" stroke="#f1ead8" stroke-width="3"/>`,5);
 s+=loop(`<rect x="0" y="430" width="400" height="100" fill="#e2c896" stroke="none"/><path d="M0,430 H400" fill="none" stroke-width="2"/><path d="M10,486 h40 M110,486 h40 M210,486 h40 M310,486 h40" fill="none" stroke="#c9b083" stroke-width="4"/>`+[30,140,260,350].map(x=>`<ellipse cx="${x}" cy="${455+(x%30)}" rx="5" ry="3" fill="#b0a996" stroke-width="1.2"/>`).join(''),1.4);
 s+=`<g transform="translate(150,512)">${horseCart()}</g>`;
 s+=loop(`<rect x="0" y="528" width="400" height="80" fill="#a3ad66" stroke="none"/><path d="M0,528 H400" fill="none" stroke-width="2"/>`+[20,70,120,190,240,300,360].map(x=>`<path d="M${x},560 l-4,-12 M${x},560 l0,-15 M${x},560 l4,-12" fill="none" stroke="#56603a" stroke-width="2"/>`).join('')+[95,215,330].map(x=>`<circle cx="${x}" cy="575" r="4" fill="${pk(['#e3a89e','#f1ead8','#d4ac52'])}" stroke-width="1.2"/>`).join(''),.9);
 return s+`</g></svg>`;
}
function cableRideSVG(){
 const loop=(inner,dur)=>`<g class="rl" style="--d:${dur}s"><g>${inner}</g><g transform="translate(399,0)">${inner}</g></g>`;
 const tree=(x,y,k)=>`<g transform="translate(${x},${y}) scale(${k})">${pineS()}</g>`;
 let s=`<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><g stroke="${OL}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">`;
 s+=`<rect width="400" height="600" fill="#e6eef0" stroke="none"/><circle cx="70" cy="100" r="30" fill="#f5d27a" stroke="none"/>`;
 s+=loop(T(90,150,.9,swirl())+T(300,80,.7,swirl()),40);
 s+=loop(`<path d="M0,330 L0,250 L60,160 L110,220 L170,110 L240,210 L300,140 L360,230 L400,250 L400,330Z" fill="#dfe7ea"/><path d="M48,178 L60,160 L72,178 L66,174 L60,180 L54,174Z M156,134 L170,110 L184,134 L176,128 L170,138 L164,128Z M288,160 L300,140 L312,160 L306,156 L300,164 L294,156Z" fill="#fbf9f3" stroke-width="1.4"/>`,30);
 s+=loop(`<path d="M0,600 L0,380 Q100,340 200,372 Q300,334 400,380 L400,600Z" fill="#f7f5ef"/>`+[[30,400,.5],[120,382,.45],[230,392,.5],[330,388,.45],[80,470,.6],[190,500,.65],[300,470,.6]].map(([x,y,k])=>tree(x,y,k)).join(''),14);
 s+=loop([[20,600,1],[150,610,1.1],[270,596,.95],[370,612,1.05]].map(([x,y,k])=>tree(x,y,k)).join(''),5);
 s+=`<path d="M-20,470 L420,170" fill="none" stroke-width="2.4"/><path d="M-20,484 L420,184" fill="none" stroke-width="1.4" opacity=".6"/>`;
 s+=`<g transform="translate(200,320) scale(2.3)" stroke-width="1">${cabinSVG('#c4473c',true)}</g>`;
 return s+`</g></svg>`}
function ride(mid,done,kind){const cab=kind==='cable',el=$('#ride');el.innerHTML=(cab?cableRideSVG():rideSVG())+`<span>${cab?'搭纜車上山，前往雪山溫泉村⋯':'乾草車出發，前往東方農莊⋯'}</span>`;el.classList.add('on');
 let clop=0;const ci=setInterval(()=>{cab?tone(clop++%3?300:360,.09,'sine',.05):tone(clop++%2?520:420,.06,'triangle',.06)},cab?420:230);
 setTimeout(()=>{try{mid()}catch(e){console.error(e)}},1100);
 setTimeout(()=>{clearInterval(ci);el.classList.remove('on');setTimeout(()=>{el.innerHTML='';done&&done()},520)},4300)}

},30);
