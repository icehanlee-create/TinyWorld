<title>奇幻小鎮大搜查</title>
<style>
:root{--bg:#f3e7cb;--ink:#2b2420;--muted:#7a6e60;--accent:#c4572f;--ok:#4f8a3a;--card:#fffaf0;--line:#dccfae;--bar:#3a4250}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2f3a4a;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#f4ede0;cursor:grab}
#world,#fogWorld{position:absolute;left:0;top:0;width:2800px;height:1800px;transform-origin:0 0;will-change:transform}
#fogWorld{pointer-events:none}
.drift{transform-box:fill-box;animation:drift var(--d,24s) ease-in-out infinite}@keyframes drift{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
.jig{transform-box:fill-box;transform-origin:50% 100%;animation:jig .5s ease-out}@keyframes jig{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7px) rotate(-6deg)}40%{transform:translateY(0) rotate(5deg) scale(1.05,.95)}60%{transform:translateY(-3px) rotate(-3deg)}80%{transform:rotate(2deg)}}

#lockWall{transition:opacity 2.2s}#lockWall.gone2{opacity:0}

.rl{animation:rl var(--d) linear infinite}@keyframes rl{to{transform:translateX(-399px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gallop{transform-box:fill-box;transform-origin:50% 0;animation:gal .42s ease-in-out infinite alternate}@keyframes gal{from{transform:rotate(-18deg)}to{transform:rotate(16deg)}}
.cbob{animation:cbob .21s ease-in-out infinite alternate}@keyframes cbob{to{transform:translateY(-3px)}}
.dust{transform-box:fill-box;transform-origin:center;animation:dust .75s ease-out infinite}@keyframes dust{from{transform:translate(0,0) scale(.6);opacity:.9}to{transform:translate(-40px,-14px) scale(1.4);opacity:0}}
#curtain{position:absolute;inset:0;background:#f4ede0;opacity:0;pointer-events:none;transition:opacity .45s;display:grid;place-items:center;z-index:5}#curtain.on{opacity:1;pointer-events:auto}#curtain svg{position:absolute;inset:0;width:100%;height:100%}#curtain span{position:relative;font-size:15px;color:#7a6e60;font-weight:700;background:rgba(244,237,224,.85);padding:6px 14px;border-radius:999px}
.cdrift{animation:cdr 3s ease-in-out infinite}@keyframes cdr{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.chip.bump .ic{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
.item .inner{transform-box:fill-box;transform-origin:center}
.item.got .inner{animation:vanish .55s ease-in forwards}
@keyframes vanish{0%{transform:scale(1);opacity:1}35%{transform:scale(1.5);opacity:1}100%{transform:scale(0);opacity:0}}

:root{--ink:#2b2420;--paper:#fffaf0;--parch:#fbf3e2;--acc:#a8461f;--muted:#5f554a;--gold:#f5c842;--ok:#3d7a32;--ui:'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}

#stage{position:absolute;inset:0}

@keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1.15)}90%{opacity:.6;transform:scale(.9)}}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 5s ease-in-out infinite}.spark.fast{animation-duration:2.2s}.spark.slow{animation-duration:12s}
@keyframes cpop{0%{transform:translateY(10px) scale(.2);opacity:0}60%{transform:translateY(-14px) scale(1.25);opacity:1}100%{transform:translateY(0) scale(1)}}

.colsec{background:var(--parch);border:2px solid var(--ink);border-radius:16px;padding:10px 10px 12px}.colsec h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}

.colgrid div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;text-align:center;line-height:1.2}.colgrid .ic{width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center}
.colgrid .ic svg{width:28px;height:28px}.colgrid .no .ic{opacity:.35;filter:grayscale(1)}.colgrid .no span{color:var(--muted)}

#mapOv{z-index:12;isolation:isolate}#mapOv .mapc{-webkit-transform:translateZ(0);transform:translateZ(0)}

.overlay.start{align-items:flex-end;padding:0;background:linear-gradient(rgba(43,36,32,0) 0%,rgba(43,36,32,.15) 40%,rgba(43,36,32,.35) 100%)}

.lvchip{display:inline-block;font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
#gameTitle{margin:8px 0 0;font-size:34px;font-weight:400;color:var(--paper);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
.sheet{position:relative;width:100%;max-width:600px;background:var(--parch);border-top:2.5px solid var(--ink);border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:78vh;max-height:78dvh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:baseline;justify-content:space-between}.shead b{font-size:18px;font-weight:400}.shead span{font-size:13px;color:var(--muted)}

.how{display:flex;gap:6px;background:var(--paper);border:2px solid #e2d4b6;border-radius:14px;padding:10px 6px}.how div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center;line-height:1.35}.how svg{color:var(--ink)}
.rule{margin:0;font-size:13px;color:var(--muted);text-align:center}
#startBest{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}#startBest:empty{display:none}
.testrow{display:flex;flex-direction:column;align-items:center;gap:6px}#testBadge{margin:0;color:var(--ok);font-size:13px}

.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.mhead b{font-size:26px;font-weight:400;display:block}.mhead span{font-size:13px;color:var(--muted)}
#mapSvg svg{display:block;width:100%;height:auto}
#mapCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding-top:6px}

.lcard .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px}.lcard .top>span:first-child,.lcard .top>b:first-child{white-space:nowrap}body:has(#startOv:not(.hide)) #hud,body:has(#startOv:not(.hide)) .zpill,body:has(#startOv:not(.hide)) #tray{visibility:hidden}body:has(#colOv:not(.hide)) #hud,body:has(#colOv:not(.hide)) .zpill,body:has(#colOv:not(.hide)) #tray,body:has(#mapOv:not(.hide)) #hud,body:has(#mapOv:not(.hide)) .zpill,body:has(#mapOv:not(.hide)) #tray{visibility:hidden}.lcard small{font-size:12px;color:var(--muted)}
.tag{font-size:12px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
.stars{display:flex;gap:2px}
.mnode{cursor:pointer}
.winc{padding:42px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
.ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 22px;font-size:22px;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.wstars{display:flex;gap:10px;justify-content:center;}.wstars.four{gap:4px}.wstars{align-items:flex-start}.wstars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;margin-top:10px;animation:starpop .45s both}.wstars div.mid{margin-top:0}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wstats{display:flex;gap:8px;width:100%}.wstats div{flex:1;background:var(--parch);border:2px solid #e2d4b6;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center}.wstats b{font-size:20px;font-weight:400}.wstats span{font-size:12px;color:var(--muted)}

.row2{display:flex;gap:10px;width:100%}
/* idle animations: paused unless near the view */
.an{transform-box:fill-box;transform-origin:50% 100%;animation-duration:var(--d,2s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-play-state:paused}
.on .an{animation-play-state:running}
.still .an{animation:none!important}
.a-bob{animation-name:bob}.a-sway{animation-name:sway}.a-hop{animation-name:hop}.a-wig{animation-name:wig}.a-peck{animation-name:peck}
.a-float{animation-name:float}.a-rock{animation-name:rock}.a-swim{animation-name:swim}.a-flap{animation-name:flap}
.a-swing{transform-origin:50% 0%;animation-name:swing}@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-spin{transform-origin:50% 50%;animation-name:spin;animation-timing-function:linear}
.a-steam{animation-name:steam;animation-timing-function:ease-out}@keyframes steam{0%{transform:translateY(8px) scale(.75);opacity:0}30%{opacity:.85}100%{transform:translateY(-26px) scale(1.25);opacity:0}}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,62%,100%{transform:translateY(0) scale(1,1)}70%{transform:translateY(0) scale(1.06,.92)}80%{transform:translateY(-7px) scale(.96,1.05)}90%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wig{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-9deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-4deg)}}
@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(22deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rock{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-2px) rotate(3deg)}}
@keyframes swim{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes flap{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flag{0%,100%{transform:skewY(-8deg) scaleX(1)}50%{transform:skewY(8deg) scaleX(.85)}}

/* ---- 秘境 ---- */
body.secret .ring,body.secret .fstat,body.secret .zpill{display:none!important}
body.secret #tray{padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}body.secret #chips{gap:4px;padding:2px 8px;justify-content:center}
body.secret .chip{width:42px;gap:0}body.secret .chip .ic{width:40px;height:40px;border-width:2px}body.secret .chip .ic svg{width:30px;height:30px}body.secret .chip .dots{display:flex;gap:2px;margin-top:3px}body.secret .chip .dots i{width:7px;height:7px;border-width:1.4px}
body.secret .chip .ok{width:17px;height:17px;font-size:9px;right:-4px;top:-4px}
.lcard.secret{background:#efe9fb;border-color:#4a3d82}.colsec.secret{background:#f1ecfa}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted)}
#stage{overflow:hidden;touch-action:none;background:#f4ede0;cursor:grab}
